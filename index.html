<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM-Friendly DFA/NFA Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>LLM-Friendly DFA/NFA Generator</h1>
          <p>Define machine lines on the left, inspect JSON and graph on the right.</p>
        </div>
        <div class="topbar-actions">
          <button id="loadSampleBtn" type="button">Load Sample</button>
          <button id="parseBtn" type="button" class="primary">Generate</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="panel left-column">
          <div class="panel-title-row">
            <h2>Machine Input</h2>
          </div>
          <label for="machineInput" class="hint">
            Format: <code>state - flags - symbol(target) symbol2,symbol3(target)</code>
          </label>
          <textarea
            id="machineInput"
            spellcheck="false"
            placeholder="q0 - start - 1(q2) 0(qt)\nq1 - accept - 1,0(q1)\nqt - trap - 1,0(qt)"
          ></textarea>

          <div class="panel-title-row small-gap">
            <h2>Messages</h2>
          </div>
          <div id="messages" class="messages" role="status" aria-live="polite"></div>

          <div class="panel-title-row">
            <h2>LLM Instruction</h2>
            <button id="copyPromptBtn" type="button">Copy</button>
          </div>
          <pre id="promptOutput" class="output-box slim">Generate to view reusable LLM instruction...</pre>
        </aside>

        <section class="panel right-column">
          <div class="panel-title-row">
            <h2>Graph View</h2>
            <div class="panel-actions">
              <button id="zoomInBtn" type="button">+</button>
              <button id="zoomOutBtn" type="button">−</button>
              <button id="resetViewBtn" type="button">Reset</button>
            </div>
          </div>
          <div id="graphWrapper" class="graph-wrapper">
            <svg id="graphSvg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-label="State machine graph"></svg>
          </div>

          <div class="panel-title-row stack-mobile">
            <h2>Normalized JSON</h2>
            <button id="copyJsonBtn" type="button">Copy JSON</button>
          </div>
          <pre id="jsonOutput" class="output-box">Generate to view normalized machine JSON...</pre>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
